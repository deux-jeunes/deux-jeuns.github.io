<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="응원 알리미">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>응원 알리미</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1a1d21; --sub: #6b7280; --line: #e5e7eb;
    --accent: #ff5a36; --accent-soft: #ffece7; --ok: #16a34a; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1b1e24; --text: #f1f3f5; --sub: #9aa1ab; --line: #2a2e36; --accent-soft: #3a211b; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, -apple-system, sans-serif; background: var(--bg); color: var(--text);
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
  header { padding: 16px 16px 8px; }
  header h1 { font-size: 20px; font-weight: 800; }
  header .meta { color: var(--sub); font-size: 13px; margin-top: 2px; }
  main { padding: 0 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .hero { background: var(--accent); color: #fff; }
  .hero .label { font-size: 13px; opacity: .85; }
  .hero .who { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .hero .count { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero .eta { font-size: 14px; opacity: .9; }
  .hero .btn { background: #fff; color: var(--accent); margin-top: 12px; }
  h2 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; color: var(--sub); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row .t1 { font-weight: 700; font-size: 16px; }
  .row .t2 { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .row .right { text-align: right; font-variant-numeric: tabular-nums; }
  .row .big { font-weight: 800; font-size: 18px; }
  .row.passed { opacity: .45; }
  .row.soon .big { color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 2px; }
  .tag.ok { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
  .btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; padding: 10px 14px;
    font: inherit; font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn.block { width: 100%; padding: 14px; font-size: 16px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  label.f { display: block; margin-top: 14px; font-size: 13px; color: var(--sub); font-weight: 600; }
  label.f:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
  textarea { min-height: 120px; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .empty { color: var(--sub); text-align: center; padding: 24px 0; font-size: 14px; line-height: 1.6; }
  .hint { color: var(--sub); font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .move { font-size: 12px; color: var(--sub); padding: 0 0 10px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; border: 0; background: none; padding: 12px 0 14px; font: inherit; font-size: 13px; font-weight: 700; color: var(--sub); }
  nav button.on { color: var(--accent); }
  #toast { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top)); z-index: 20; display: none;
    background: var(--text); color: var(--bg); border-radius: 14px; padding: 14px 16px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #toast.show { display: block; animation: drop .25s ease-out; }
  @keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; }
  .sheet { background: var(--card); width: 100%; max-height: 90vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { font-size: 18px; margin-bottom: 14px; }
  .splits { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
  .warn { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">응원 알리미</h1>
  <div class="meta" id="meta"></div>
</header>
<main id="app"></main>
<nav>
  <button data-tab="plan" class="on">일정</button>
  <button data-tab="runners">주자</button>
  <button data-tab="spots">응원 지점</button>
  <button data-tab="settings">설정</button>
</nav>
<div id="toast"></div>
<div id="modal"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const C = window.CheerCore;
  const KEY = 'cheer-state-v1';
  const SENT_KEY = 'cheer-sent-v1';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const hhmm = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const courseName = (km) => ({ 42.195: '풀', 21.0975: '하프', 10: '10K', 5: '5K' }[km] || km + 'km');

  const DEFAULT = {
    race: '', date: today(), start: '08:00', lead: 5, resultUrl: 'https://myresult.co.kr/177',
    spots: [], runners: [],
  };
  let state = load();
  let sent = new Set(JSON.parse(localStorage.getItem(SENT_KEY) || '[]'));
  let tab = 'plan';
  let wakeLock = null;

  function load() {
    // 공유 링크(#d=...)로 열면 그 설정을 가져옴
    const m = location.hash.match(/^#d=(.+)$/);
    if (m) {
      try {
        const s = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
        history.replaceState(null, '', location.pathname);
        if (confirm('공유받은 응원 계획을 불러올까요? (지금 내용은 바뀜)')) { localStorage.setItem(KEY, JSON.stringify(s)); localStorage.removeItem(SENT_KEY); }
      } catch (e) { /* 무시 */ }
    }
    try { return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return { ...DEFAULT }; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function saveSent() { localStorage.setItem(SENT_KEY, JSON.stringify([...sent])); }

  function schedule() { return C.buildSchedule(state, Date.now()); }
  function startMsOf(r) { return C.clockToMs(state.date, r.start || state.start); }

  function countdown(ms) {
    if (ms <= 0) return '도착 무렵';
    const s = Math.round(ms / 1000);
    if (s >= 3600) return Math.floor(s / 3600) + '시간 ' + Math.floor((s % 3600) / 60) + '분';
    if (s >= 600) return Math.floor(s / 60) + '분';
    return Math.floor(s / 60) + '분 ' + String(s % 60).padStart(2, '0') + '초';
  }

  // ---------- 화면 ----------
  function render() {
    $('#title').textContent = state.race || '응원 알리미';
    $('#meta').textContent = state.date + ' · 기본 출발 ' + state.start + ' · ' + state.lead + '분 전 알림';
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const fn = { plan: renderPlan, runners: renderRunners, spots: renderSpots, settings: renderSettings }[tab];
    $('#app').innerHTML = fn();
  }

  function renderPlan() {
    if (!state.runners.length || !state.spots.length) {
      return '<div class="card empty">' +
        (!state.runners.length ? '응원할 주자를 먼저 등록<br>' : '') +
        (!state.spots.length ? '응원 지점(몇 km)을 추가<br>' : '') +
        '<div class="btns" style="justify-content:center">' +
        (!state.runners.length ? '<button class="btn primary" data-act="add-runner">주자 추가</button>' : '') +
        (!state.spots.length ? '<button class="btn primary" data-act="add-spot">지점 추가</button>' : '') +
        '</div></div>';
    }
    const rows = schedule();
    const up = rows.filter((r) => r.status === 'upcoming');
    const past = rows.filter((r) => r.status === 'passed');
    let h = '';
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') {
      h += '<div class="warn">알림 꺼짐 · 설정에서 알림 켜기 (화면 안 배너·소리는 동작)</div>';
    }
    const next = up[0];
    if (next) {
      h += '<div class="card hero"><div class="label">다음 도착 · ' + esc(next.spot.name || next.spot.km + 'km') + ' (' + next.spot.km + 'km)</div>' +
        '<div class="who">' + esc(next.runner.name) + (next.runner.bib ? ' <span style="opacity:.8;font-size:16px">#' + esc(next.runner.bib) + '</span>' : '') + '</div>' +
        '<div class="count" data-cd="' + next.etaMs + '">' + countdown(next.etaMs - Date.now()) + '</div>' +
        '<div class="eta">예상 ' + hhmm(next.etaMs) + ' · 남은 페이스 ' + C.fmtPace(next.pace) + '/km</div>' +
        '<button class="btn" data-act="pass" data-r="' + next.runnerId + '" data-s="' + next.spotId + '">지금 통과 기록</button></div>';
    } else {
      h += '<div class="card empty">모든 주자가 응원 지점을 지나감 👏</div>';
    }
    if (up.length > 1 || (up.length && !next)) {
      h += '<h2>이후 도착 예정</h2><div class="card">';
      up.slice(1).forEach((r, i) => {
        h += rowHtml(r);
        // 같은 주자의 앞 지점과 시간차 = 이동 가능 시간
        const prev = up.slice(0, i + 1).reverse().find((x) => x.runnerId === r.runnerId);
        if (prev) h += '<div class="move">↳ ' + esc(prev.spot.name || prev.spot.km + 'km') + '에서 이동 여유 ' + countdown(r.etaMs - prev.etaMs) + '</div>';
      });
      h += '</div>';
    }
    if (past.length) {
      h += '<h2>지나감</h2><div class="card">' + past.slice().reverse().map(rowHtml).join('') + '</div>';
    }
    return h;
  }

  function rowHtml(r) {
    const passed = r.status === 'passed';
    const soon = !passed && r.etaMs - Date.now() <= state.lead * 60000;
    return '<div class="row' + (passed ? ' passed' : '') + (soon ? ' soon' : '') + '">' +
      '<div class="main"><div class="t1">' + esc(r.runner.name) + (r.runner.bib ? ' <span class="t2">#' + esc(r.runner.bib) + '</span>' : '') + '</div>' +
      '<div class="t2">' + esc(r.spot.name || '') + ' ' + r.spot.km + 'km' + (r.actual ? '<span class="tag ok">실측</span>' : '') + '</div></div>' +
      '<div class="right"><div class="big">' + hhmm(r.etaMs) + '</div>' +
      '<div class="t2"' + (passed ? '' : ' data-cd="' + r.etaMs + '"') + '>' + (passed ? '통과 ' + C.fmtDuration(r.elapsedSec) : countdown(r.etaMs - Date.now())) + '</div></div>' +
      (passed ? '' : '<button class="btn small" data-act="pass" data-r="' + r.runnerId + '" data-s="' + r.spotId + '">통과</button>') +
      '</div>';
  }

  function renderRunners() {
    let h = '<div class="btns" style="margin:0 0 12px"><button class="btn primary" data-act="add-runner">+ 주자 추가</button>' +
      (state.resultUrl ? '<a class="btn ghost" href="' + esc(state.resultUrl) + '" target="_blank" rel="noopener">기록 사이트 열기</a>' : '') + '</div>';
    if (!state.runners.length) return h + '<div class="card empty">등록된 주자 없음</div>';
    for (const r of state.runners) {
      const splits = C.normalizeSplits(r.splits);
      const pace = C.estimatePace({ ...r, courseKm: r.courseKm || 42.195 });
      h += '<div class="card"><div class="row" style="padding:0"><div class="main">' +
        '<div class="t1">' + esc(r.name) + (r.bib ? ' <span class="t2">#' + esc(r.bib) + '</span>' : '') + '</div>' +
        '<div class="t2">' + courseName(r.courseKm) + ' · 출발 ' + esc(r.start || state.start) +
        (r.targetSec ? ' · 목표 ' + C.fmtDuration(r.targetSec) : '') + ' · 예상 페이스 ' + C.fmtPace(pace) + '/km</div></div>' +
        '<button class="btn small ghost" data-act="edit-runner" data-r="' + r.id + '">수정</button></div>' +
        '<div class="splits">' + (splits.length ? '기록: ' + splits.map((s) => (+s.km.toFixed(2)) + 'km ' + C.fmtDuration(s.sec)).join(' · ') : '기록 없음 · 목표 기준으로 계산') + '</div>' +
        '<div class="btns"><button class="btn small" data-act="splits" data-r="' + r.id + '">기록 입력</button>' +
        (splits.length ? '<button class="btn small ghost" data-act="clear-splits" data-r="' + r.id + '">기록 지우기</button>' : '') + '</div></div>';
    }
    return h;
  }

  function renderSpots() {
    let h = '<div class="btns" style="margin:0 0 12px"><button class="btn primary" data-act="add-spot">+ 응원 지점 추가</button></div>';
    if (!state.spots.length) return h + '<div class="card empty">응원할 위치를 km로 추가<br><span class="hint">예: 반환점 21km, 30km 급수대</span></div>';
    const rows = schedule();
    for (const sp of state.spots.slice().sort((a, b) => a.km - b.km)) {
      const mine = rows.filter((r) => r.spotId === sp.id);
      h += '<div class="card"><div class="row" style="padding:0 0 4px"><div class="main"><div class="t1">' + esc(sp.name || '응원 지점') + ' <span class="tag">' + sp.km + 'km</span></div>' +
        (sp.memo ? '<div class="t2">' + esc(sp.memo) + '</div>' : '') + '</div>' +
        '<button class="btn small ghost" data-act="edit-spot" data-s="' + sp.id + '">수정</button></div>' +
        (mine.length ? mine.map(rowHtml).join('') : '<div class="hint">이 지점을 지나는 주자 없음</div>') + '</div>';
    }
    return h;
  }

  function renderSettings() {
    const perm = typeof Notification === 'undefined' ? '지원 안 함(아이폰은 홈 화면에 추가 후 사용)' : { granted: '켜짐', denied: '차단됨(브라우저 설정에서 허용)', default: '꺼짐' }[Notification.permission];
    return '<div class="card">' +
      '<label class="f">대회 이름<input id="s-race" value="' + esc(state.race) + '" placeholder="예: 2026 OO마라톤"></label>' +
      '<div class="grid2"><label class="f">대회 날짜<input id="s-date" type="date" value="' + esc(state.date) + '"></label>' +
      '<label class="f">기본 출발 시각<input id="s-start" type="time" value="' + esc(state.start) + '"></label></div>' +
      '<label class="f">미리 알림 (도착 몇 분 전)<input id="s-lead" type="number" min="1" max="60" inputmode="numeric" value="' + state.lead + '"></label>' +
      '<label class="f">기록 사이트 주소<input id="s-url" type="url" value="' + esc(state.resultUrl) + '"></label>' +
      '<div class="btns"><button class="btn primary" data-act="save-settings">저장</button></div></div>' +
      '<div class="card"><div class="t1">알림 · ' + perm + '</div>' +
      '<div class="hint">도착 ' + state.lead + '분 전, 1분 전에 알림 + 진동 + 소리. 앱(화면)이 열려 있어야 정확함 → 화면 켜두기 권장.</div>' +
      '<div class="btns"><button class="btn" data-act="perm">알림 켜기</button><button class="btn" data-act="test">알림 테스트</button>' +
      '<button class="btn" data-act="wake">' + (wakeLock ? '화면 켜두기 해제' : '화면 켜두기') + '</button></div></div>' +
      '<div class="card"><div class="t1">함께 응원하는 사람과 공유</div><div class="hint">주자·지점·기록을 링크로 전달. 받은 사람이 열면 그대로 불러옴.</div>' +
      '<div class="btns"><button class="btn" data-act="share">공유 링크 만들기</button><button class="btn ghost" data-act="reset">전체 초기화</button></div></div>' +
      '<div class="card hint">사용법<br>1) 주자 등록: 이름·배번·코스·출발 시각·목표 기록<br>2) 응원 지점 추가: 몇 km 지점인지<br>3) 대회 중 기록 사이트에서 주자의 구간 기록을 복사 → 주자 탭 [기록 입력]에 붙여넣기 → 예상 시각 자동 보정<br>4) 직접 본 경우 일정 탭 [통과] 누르기 → 그 시각이 실측 기록으로 저장</div>';
  }

  // ---------- 모달 ----------
  function openSheet(html) {
    $('#modal').innerHTML = '<div class="modal-bg"><div class="sheet">' + html + '</div></div>';
    $('#modal .modal-bg').addEventListener('click', (e) => { if (e.target.classList.contains('modal-bg')) closeSheet(); });
  }
  function closeSheet() { $('#modal').innerHTML = ''; }

  function runnerSheet(r) {
    const isNew = !r;
    r = r || { id: uid(), name: '', bib: '', courseKm: 42.195, start: '', targetSec: null, splits: [] };
    const opts = [[42.195, '풀 42.195km'], [21.0975, '하프 21.1km'], [10, '10K'], [5, '5K']];
    const custom = !opts.some((o) => o[0] === r.courseKm);
    openSheet('<h3>' + (isNew ? '주자 추가' : '주자 수정') + '</h3>' +
      '<div class="grid2"><label class="f">이름<input id="r-name" value="' + esc(r.name) + '" placeholder="이름"></label>' +
      '<label class="f">배번<input id="r-bib" value="' + esc(r.bib) + '" inputmode="numeric" placeholder="선택"></label></div>' +
      '<div class="grid2"><label class="f">코스<select id="r-course">' + opts.map((o) => '<option value="' + o[0] + '"' + (o[0] === r.courseKm ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '<option value="custom"' + (custom ? ' selected' : '') + '>직접 입력</option></select></label>' +
      '<label class="f">거리(km)<input id="r-km" type="number" step="0.001" value="' + r.courseKm + '"' + (custom ? '' : ' disabled') + '></label></div>' +
      '<div class="grid2"><label class="f">출발 시각<input id="r-start" type="time" value="' + esc(r.start || '') + '"></label>' +
      '<label class="f">목표 기록<input id="r-target" value="' + (r.targetSec ? C.fmtDuration(r.targetSec) : '') + '" placeholder="4:30:00"></label></div>' +
      '<div class="hint">출발 시각 비우면 기본 출발(' + esc(state.start) + ') 사용. 조별 출발이면 실제 출발 시각 입력. 목표 기록은 기록이 들어오기 전 예상에만 사용.</div>' +
      '<div class="btns" style="margin-top:20px"><button class="btn primary" id="r-save" style="flex:1">저장</button>' +
      (isNew ? '' : '<button class="btn ghost" id="r-del">삭제</button>') + '</div>');
    $('#r-course').addEventListener('change', (e) => {
      const v = e.target.value;
      $('#r-km').disabled = v !== 'custom';
      if (v !== 'custom') $('#r-km').value = v;
    });
    $('#r-save').addEventListener('click', () => {
      const name = $('#r-name').value.trim();
      if (!name) return toast('이름 입력 필요');
      const t = $('#r-target').value.trim();
      const targetSec = t ? C.parseDuration(t) : null;
      if (t && !targetSec) return toast('목표 기록 형식: 4:30:00');
      const km = parseFloat($('#r-km').value);
      if (!(km > 0)) return toast('거리 확인 필요');
      Object.assign(r, { name, bib: $('#r-bib').value.trim(), courseKm: km, start: $('#r-start').value, targetSec });
      if (isNew) state.runners.push(r);
      save(); closeSheet(); render();
    });
    if (!isNew) $('#r-del').addEventListener('click', () => {
      if (!confirm(r.name + ' 삭제?')) return;
      state.runners = state.runners.filter((x) => x.id !== r.id);
      save(); closeSheet(); render();
    });
  }

  function spotSheet(sp) {
    const isNew = !sp;
    sp = sp || { id: uid(), name: '', km: '', memo: '' };
    openSheet('<h3>' + (isNew ? '응원 지점 추가' : '응원 지점 수정') + '</h3>' +
      '<div class="grid2"><label class="f">지점 이름<input id="p-name" value="' + esc(sp.name) + '" placeholder="예: 반환점"></label>' +
      '<label class="f">거리(km)<input id="p-km" type="number" step="0.1" inputmode="decimal" value="' + esc(sp.km) + '" placeholder="21.1"></label></div>' +
      '<label class="f">메모<input id="p-memo" value="' + esc(sp.memo) + '" placeholder="예: 편의점 앞, 2번 출구"></label>' +
      '<div class="btns" style="margin-top:20px"><button class="btn primary" id="p-save" style="flex:1">저장</button>' +
      (isNew ? '' : '<button class="btn ghost" id="p-del">삭제</button>') + '</div>');
    $('#p-save').addEventListener('click', () => {
      const km = parseFloat($('#p-km').value);
      if (!(km > 0)) return toast('거리(km) 입력 필요');
      Object.assign(sp, { name: $('#p-name').value.trim(), km, memo: $('#p-memo').value.trim() });
      if (isNew) state.spots.push(sp);
      save(); closeSheet(); render();
    });
    if (!isNew) $('#p-del').addEventListener('click', () => {
      state.spots = state.spots.filter((x) => x.id !== sp.id);
      save(); closeSheet(); render();
    });
  }

  function splitsSheet(r) {
    const cur = C.normalizeSplits(r.splits).map((s) => (+s.km.toFixed(4)) + 'km ' + C.fmtDuration(s.sec)).join('\n');
    openSheet('<h3>' + esc(r.name) + ' 기록 입력</h3>' +
      '<div class="hint">기록 사이트의 구간 기록(5km, 10km, 하프…)을 복사해 붙여넣기. 한 줄에 "거리 경과시간" 형식이면 인식.<br>예) 10km 0:55:12 / Half 1:58:40</div>' +
      (state.resultUrl ? '<div class="btns"><a class="btn small ghost" href="' + esc(state.resultUrl) + '" target="_blank" rel="noopener">기록 사이트 열기</a></div>' : '') +
      '<label class="f">구간 기록<textarea id="sp-text" placeholder="5km 0:27:40\n10km 0:55:12">' + esc(cur) + '</textarea></label>' +
      '<div class="hint" id="sp-prev"></div>' +
      '<div class="btns" style="margin-top:16px"><button class="btn primary block" id="sp-save">저장</button></div>');
    const preview = () => {
      const p = C.parseSplits($('#sp-text').value, r.courseKm);
      $('#sp-prev').textContent = p.length ? '인식: ' + p.map((s) => (+s.km.toFixed(2)) + 'km ' + C.fmtDuration(s.sec)).join(' · ') : '인식된 기록 없음';
    };
    $('#sp-text').addEventListener('input', preview); preview();
    $('#sp-save').addEventListener('click', () => {
      r.splits = C.parseSplits($('#sp-text').value, r.courseKm);
      save(); closeSheet(); render(); toast(r.name + ' 기록 ' + r.splits.length + '개 반영');
    });
  }

  // ---------- 알림 ----------
  let audioCtx = null;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((t) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
      });
    } catch (e) { /* 무시 */ }
  }
  let toastTimer = null;
  function toast(msg, ms) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2500);
  }
  async function notify(title, body, tag) {
    toast(title + ' · ' + body, 8000);
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) return reg.showNotification(title, { body, tag, renotify: true, icon: 'icon.svg' });
      new Notification(title, { body, tag });
    } catch (e) { /* 무시 */ }
  }

  function checkAlerts() {
    const now = Date.now();
    const due = C.dueAlerts(C.buildSchedule(state, now), now, state.lead, sent);
    for (const a of due) {
      const r = a.row, place = (r.spot.name ? r.spot.name + ' ' : '') + r.spot.km + 'km';
      if (a.kind === 'now') notify('📣 ' + r.runner.name + ' 곧 도착!', place + ' · 예상 ' + hhmm(r.etaMs) + ' · 준비하세요', a.key);
      else notify('🏃 ' + r.runner.name + ' ' + Math.max(1, Math.round((r.etaMs - now) / 60000)) + '분 전', place + ' 도착 예상 ' + hhmm(r.etaMs), a.key);
      a.markKeys.forEach((k) => sent.add(k));
    }
    if (due.length) { saveSent(); if (tab === 'plan') render(); }
  }

  async function toggleWake() {
    try {
      if (wakeLock) { await wakeLock.release(); wakeLock = null; }
      else if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      else toast('이 브라우저는 화면 켜두기 미지원');
    } catch (e) { toast('화면 켜두기 실패'); }
    render();
  }

  // ---------- 이벤트 ----------
  document.querySelector('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });

  $('#app').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    const runner = state.runners.find((x) => x.id === b.dataset.r);
    const spot = state.spots.find((x) => x.id === b.dataset.s);
    if (act === 'add-runner') runnerSheet();
    else if (act === 'edit-runner') runnerSheet(runner);
    else if (act === 'add-spot') spotSheet();
    else if (act === 'edit-spot') spotSheet(spot);
    else if (act === 'splits') splitsSheet(runner);
    else if (act === 'clear-splits') { if (confirm('기록 지우기?')) { runner.splits = []; save(); render(); } }
    else if (act === 'pass') {
      const sec = (Date.now() - startMsOf(runner)) / 1000;
      if (sec <= 0) return toast('아직 출발 전');
      runner.splits = C.normalizeSplits([...(runner.splits || []), { km: spot.km, sec: Math.round(sec) }]);
      save(); render(); toast(runner.name + ' ' + spot.km + 'km 통과 기록 · 다음 지점 예상 보정');
    }
    else if (act === 'save-settings') {
      state.race = $('#s-race').value.trim();
      state.date = $('#s-date').value || today();
      state.start = $('#s-start').value || '08:00';
      state.lead = Math.min(60, Math.max(1, parseInt($('#s-lead').value, 10) || 5));
      state.resultUrl = $('#s-url').value.trim();
      save(); render(); toast('저장됨');
    }
    else if (act === 'perm') {
      if (typeof Notification === 'undefined') return toast('아이폰: 공유 → 홈 화면에 추가 후 앱으로 열기');
      await Notification.requestPermission(); render();
    }
    else if (act === 'test') notify('🏃 알림 테스트', '도착 ' + state.lead + '분 전에 이렇게 알려줌', 'test');
    else if (act === 'wake') toggleWake();
    else if (act === 'share') {
      const url = location.origin + location.pathname + '#d=' + btoa(unescape(encodeURIComponent(JSON.stringify(state))));
      if (navigator.share) navigator.share({ title: '응원 계획', url }).catch(() => {});
      else { await navigator.clipboard.writeText(url); toast('링크 복사됨'); }
    }
    else if (act === 'reset') {
      if (!confirm('주자·지점·기록 전부 삭제?')) return;
      state = { ...DEFAULT, date: today() }; sent = new Set(); save(); saveSent(); render();
    }
  });

  // 매초 카운트다운 갱신 + 알림 확인
  setInterval(() => {
    document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = countdown(+el.dataset.cd - Date.now()); });
    checkAlerts();
  }, 1000);
  // 1분마다 전체 갱신(순서·지나감 반영)
  setInterval(() => { if (!$('#modal').innerHTML && tab !== 'settings') render(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkAlerts(); render(); if (wakeLock === null) { /* 화면 복귀 시 자동 재요청 안 함 */ } }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
})();
</script>
</body>
</html>
